<!DOCTYPE html>
<html>
<head>
    <title>Login | Nextura-E-Message</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#151515;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard">
             <img src="{{ url_for('static', filename='images/WhatsApp Image 2026-01-15 at 7.21.47 PM.jpeg') }}"
                 width="30" height="30" class="me-2">
            <span style="color:#ff4500; font-weight:bold;">Nextura-E-Message</span>
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span id="status-dot" class="me-3" style="width:12px; height:12px; border-radius:50%; display:inline-block; background-color:gray;"></span>
            <span id="status-text" class="me-3">Offline</span>
            <a href="/logout" class="btn btn-outline-warning btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-3">Login</h3>

        <form method="POST">
            <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

            <button class="btn btn-success w-100">Login</button>
        </form>

        <p class="text-center mt-3">
            No account? <a href="/signup">Sign up</a>
        </p>
    </div>
</div>

</body>
</html>
