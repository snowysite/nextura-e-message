<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Nextura-E-Message</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#151515;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard">
             <img src="{{ url_for('static', filename='images/WhatsApp Image 2026-01-15 at 7.21.47 PM.jpeg') }}"
                 width="30" height="30" class="me-2">
            <span style="color:#ff4500; font-weight:bold;">Nextura-E-Message</span>
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span id="status-dot" class="me-3" style="width:12px; height:12px; border-radius:50%; display:inline-block; background-color:gray;"></span>
            <span id="status-text" class="me-3">Offline</span>
            <a href="/logout" class="btn btn-outline-warning btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 style="color:#ff4500;">Nextura-E-Message</h1>
        <p class="text-gray">Welcome, {{ username }} 👋</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Dashboard Cards -->
            <div class="card mb-3 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <span>View Users</span>
                    <a href="/users" class="btn btn-outline-warning">Go</a>
                </div>
            </div>

            <div class="card mb-3 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <span>Logout</span>
                    <a href="/logout" class="btn btn-outline-danger">Exit</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
