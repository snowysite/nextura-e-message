<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chat | Nextura-E-Message</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS (FIXED PATH) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        :root {
            --bg-dark: #151515;
            --bg-light: #f4f4f4;
            --chat-dark: #1a1a1a;
            --chat-light: #ffffff;
            --me: #ff4500;
            --them-dark: #333;
            --them-light: #e6e6e6;
            --text-dark: #fff;
            --text-light: #111;
        }

        body.dark-mode { background: var(--bg-dark); color: var(--text-dark); }
        body.light-mode { background: var(--bg-light); color: var(--text-light); }

        .chat-card {
            height: calc(100vh - 220px);
            overflow-y: auto;
            padding: 15px;
            border-radius: 14px;
            background: var(--chat-dark);
        }

        body.light-mode .chat-card { background: var(--chat-light); }

        .chat-me, .chat-them {
            padding: 8px 14px;
            border-radius: 18px;
            display: inline-block;
            max-width: 85%;
        }

        .chat-me { background: var(--me); color: #fff; }
        .chat-them { background: var(--them-dark); color: #fff; }
        body.light-mode .chat-them { background: var(--them-light); color: #111; }

        .flash-send { animation: flash .3s; }
        @keyframes flash { 0%{opacity:.4}50%{opacity:1}100%{opacity:.4} }

        #status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: gray; animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%{transform:scale(1)}
            50%{transform:scale(1.3);opacity:.6}
            100%{transform:scale(1)}
        }
    </style>
</head>

<body class="dark-mode">

<nav class="navbar navbar-dark" style="background:#151515;">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/dashboard">
            <img src="{{ url_for('static', filename='images/WhatsApp Image 2026-01-15 at 7.21.47 PM.jpeg') }}"
                 width="30" height="30" class="me-2">
            <span style="color:#ff4500;font-weight:bold;">Nextura-E-Message</span>
        </a>

        <div class="d-flex align-items-center">
            <span id="status-dot" class="me-2"></span>
            <span id="status-text" class="me-3">Offline</span>
            <a href="/logout" class="btn btn-outline-warning btn-sm me-2">Logout</a>
            <button id="theme-toggle" class="btn btn-outline-light btn-sm">🌙</button>
        </div>
    </div>
</nav>

<div class="container-fluid mt-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h5 class="mb-3" style="color:#ff4500;">Chat with {{ receiver.username }}</h5>

            <div id="chat-box" class="chat-card mb-2">
                {% for msg in messages %}
                <div class="{{ 'text-end' if msg.sender_id == my_id else 'text-start' }} mb-2">
                    <span class="{{ 'chat-me' if msg.sender_id == my_id else 'chat-them' }}">
                        {{ msg.message }}
                    </span>
                </div>
                {% endfor %}
            </div>

            <form id="chat-form" class="d-flex gap-2">
                <div id="typing-indicator" style="height:18px;color:#ff8c00;"></div>
                <input id="chat-input" class="form-control" placeholder="Type a message..." required>
                <button class="btn" style="background:#ff4500;color:white;">Send</button>
            </form>

            <a href="/users" class="btn btn-link mt-2" style="color:#ff8c00;">Back to Users</a>
        </div>
    </div>
</div>

<!-- Socket.IO (REQUIRED) -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='chat.js') }}"></script>

<script>
const socket = io();

const chatBox = document.getElementById('chat-box');
const input = document.getElementById('chat-input');
const form = document.getElementById('chat-form');
const typingIndicator = document.getElementById('typing-indicator');

const senderId = {{ my_id }};
const receiverId = {{ receiver.id }};
let typingTimeout;

socket.emit('join', { sender_id: senderId, receiver_id: receiverId });

input.addEventListener('input', () => {
    socket.emit('typing', { sender_id: senderId, receiver_id: receiverId, typing: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        socket.emit('typing', { sender_id: senderId, receiver_id: receiverId, typing: false });
    }, 1000);
});

socket.on('display_typing', data => {
    if (data.sender_id === receiverId) {
        typingIndicator.textContent = data.typing ? 'Typing...' : '';
    }
});

form.addEventListener('submit', e => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;

    const tempId = Date.now();
    socket.emit('send_message', {
        sender_id: senderId,
        receiver_id: receiverId,
        message: msg,
        temp_id: tempId
    });

    input.value = '';
});

socket.on('connect', () => {
    document.getElementById('status-dot').style.background = 'limegreen';
    document.getElementById('status-text').textContent = 'Online';
});

socket.on('disconnect', () => {
    document.getElementById('status-dot').style.background = 'gray';
    document.getElementById('status-text').textContent = 'Offline';
});
</script>

</body>
</html>
