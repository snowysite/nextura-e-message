<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nextura-E-Message{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}bg-light{% endblock %}">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg py-3 px-3" style="background-color:#151515;">
    <a class="navbar-brand text-white d-flex align-items-center" href="/dashboard">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" width="30" height="30" class="d-inline-block align-top me-2">
        <span>Nextura</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon" style="color:white;">☰</span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
                <span class="text-success" id="status-indicator">● Online</span>
            </li>
            <li class="nav-item me-3">
                <button id="theme-toggle" class="btn btn-outline-warning btn-sm">Light/Dark</button>
            </li>
            <li class="nav-item">
                <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Main Content -->
<div class="container my-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- SocketIO -->
<script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
